name: CI

on:
  push:
  pull_request:

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if personal data is tracked
        run: |
          leaked=$(git ls-files 'cvs/*' | grep -v '^cvs/\.gitkeep$' || true)
          pdfs=$(git ls-files '*.pdf' || true)
          if [ -n "$leaked$pdfs" ]; then
            echo "::error::Tracked files that must never be committed:"
            printf '%s\n' "$leaked" "$pdfs" | grep . || true
            exit 1
          fi
          echo "No personal data tracked."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite in Docker
        run: make test
